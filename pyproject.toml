[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmtraj"
version = "0.1.0"
description = "Coordinated fixed-wing trajectory planning and optional drone simulation backends"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "examples/gazebo/LICENSE.PX4", "examples/gazebo/NOTICE.md"]
requires-python = ">=3.12"
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/papantonin/SwarmTraj"
Repository = "https://github.com/papantonin/SwarmTraj"
Issues = "https://github.com/papantonin/SwarmTraj/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]
trajectory2d = ["scipy>=1.11,<2", "matplotlib>=3.8,<4"]
px4-sitl = ["mavsdk==4.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
